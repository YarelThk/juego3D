<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Arena 3D - Combate</title>
    <link rel="stylesheet" href="styles/style.css">

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.158/examples/jsm/"
      }
    }
    </script>

</head>
<body>

<div id="ui">
    <div class="player-ui">
        <h2>Jugador</h2>
        <div class="bar health" id="playerHealth"></div>
        <div class="bar energy" id="playerEnergy"></div>
    </div>

    <div class="enemy-ui">
        <h2>Enemigo</h2>
        <div class="bar health enemy" id="enemyHealth"></div>
    </div>
</div>

<footer>
    <h1>Arena 3D - Sistema de Combate</h1>
    <p>WASD: mover | Shift: correr | k: atacar | l: patada | B: bloquear</p>
</footer>

<script type="module" src="./js/main.js"></script>

</body>
</html>
